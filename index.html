<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mariposa Azul</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d13;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }

    body { font-family: 'Courier New', Courier, monospace; }

    #cielo { position: fixed; inset: 0; overflow: hidden; }

    .mariposa {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .mariposa pre {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      line-height: 1.1;
      white-space: pre;
    }

    #controles {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(14px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 10;
    }

    #controles button {
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(11, 13, 19, 0.85);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #btn-azul  { color: #00d2ff; border: 1px solid #00d2ff; box-shadow: 0 0 8px #0077ff; }
    #btn-verde { color: #4dff88; border: 1px solid #4dff88; box-shadow: 0 0 8px #00b341; }
    #controles button:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div id="cielo"></div>

  <div id="controles">
    <button id="btn-azul" type="button">+ Mariposa azul</button>
    <button id="btn-verde" type="button">+ Mariposa verde</button>
  </div>

<script>
    const COLS_ORIGINALES = 160;     // ancho de cada bloque original
    const RATIO_CHAR = 0.6;          // ancho de un carácter / tamaño de fuente
    const ALTO_LINEA = 1.1;          // line-height definido en el CSS
    const MAX_MARIPOSAS = 15;
    const FS_BASE = 10;              // la letra siempre se dibuja a este tamaño y se reduce con scale
    const TICK_MS = 130;             // velocidad de "stop motion" (más alto = más entrecortado)

    const cielo = document.getElementById('cielo');

    // --- Preparar los fotogramas: limpiar bordes y recortar al área común ---
    const leer = id => document.getElementById(id).textContent.split('\n');
    const brutos = [leer('f1'), leer('f2'), leer('f3')];
    const filas = Math.max(...brutos.map(f => f.length));

    const normalizados = brutos.map(f => {
      const out = [];
      for (let i = 0; i < filas; i++) {
        let l = (f[i] || '').replace(/\r/g, '').padEnd(COLS_ORIGINALES).slice(0, COLS_ORIGINALES);
        l = ' ' + l.slice(1, COLS_ORIGINALES - 1) + ' ';
        out.push(l);
      }
      return out;
    });

    let minR = Infinity, maxR = -1, minC = Infinity, maxC = -1;
    normalizados.forEach(f => f.forEach((l, r) => {
      const a = l.search(/\S/);
      if (a === -1) return;
      const b = l.trimEnd().length - 1;
      minR = Math.min(minR, r); maxR = Math.max(maxR, r);
      minC = Math.min(minC, a); maxC = Math.max(maxC, b);
    }));

    const recortados = normalizados.map(f =>
      f.slice(minR, maxR + 1).map(l => l.slice(minC, maxC + 1).trimEnd()).join('\n')
    );

    const nCols = maxC - minC + 1;
    const nFilas = maxR - minR + 1;

    // Secuencia: fase 1 -> fase 2 -> fase 3 -> fase 2
    const [F1, F2, F3] = recortados;
    const secuencia = [F1, F2, F3, F2];

    // --- Colores ---
    const COLORES = {
      azul:  { texto: '#00d2ff', brillo: '#0077ff' },
      verde: { texto: '#4dff88', brillo: '#00b341' }
    };

    // --- Tamaño según el dispositivo ---
    // Los navegadores del celular agrandan las letras muy pequeñas, así que la mariposa
    // se dibuja a FS_BASE px y se reduce con transform: scale (que no se ve afectado).
    let W = 0, H = 0, esc = 1, bw = 0, bh = 0, bw0 = 1, bh0 = 1;

    (function sondear() {
      const d = document.createElement('div');
      d.className = 'mariposa';
      d.style.visibility = 'hidden';
      const p = document.createElement('pre');
      p.style.fontSize = FS_BASE + 'px';
      p.textContent = secuencia[0];
      d.appendChild(p);
      cielo.appendChild(d);
      bw0 = p.offsetWidth || nCols * RATIO_CHAR * FS_BASE;
      bh0 = p.offsetHeight || nFilas * ALTO_LINEA * FS_BASE;
      cielo.removeChild(d);
    })();

    function medir() {
      W = window.innerWidth;
      H = window.innerHeight;
      const ratioAlto = bh0 / bw0;                                   // alto / ancho
      const objetivo = Math.min(Math.max(W * 0.25, 85), 180, (H * 0.28) / ratioAlto);
      esc = objetivo / bw0;
      bw = bw0 * esc;
      bh = bh0 * esc;
    }

    function tam(m) {
      m.cont.style.width = bw + 'px';
      m.cont.style.height = bh + 'px';
    }

    // --- Mariposas ---
    const mariposas = [];

    function crear(color, primera) {
      const cont = document.createElement('div');
      cont.className = 'mariposa';
      const pre = document.createElement('pre');
      pre.style.color = COLORES[color].texto;
      pre.style.textShadow = '0 0 6px ' + COLORES[color].brillo;
      pre.style.fontSize = FS_BASE + 'px';
      pre.style.position = 'absolute';
      pre.style.left = '0';
      pre.style.top = '0';
      pre.style.transformOrigin = '0 0';
      cont.appendChild(pre);
      cielo.appendChild(cont);

      const m = {
        cont, pre,
        t: primera ? 0 : Math.random() * 20,       // posición dentro del recorrido
        paso: primera ? 0 : Math.floor(Math.random() * secuencia.length),
        vel: primera ? 1 : 0.7 + Math.random() * 0.7,
        alt: primera ? 0.5 : 0.1 + Math.random() * 0.8,   // altura (0 arriba, 1 abajo)
        fase: Math.random() * 6.28,
        actual: null
      };
      mariposas.push(m);
      tam(m);
      dibujar(m);
      return m;
    }

    function dibujar(m) {
      const rango = Math.max(W - bw, 1);
      const velocidad = Math.max(W / 6, 70) * m.vel;   // px por segundo
      const ciclo = rango * 2;
      const pos = (m.t * velocidad) % ciclo;
      const yendo = pos < rango;
      const x = yendo ? pos : ciclo - pos;

      const libre = Math.max(H - bh, 0);
      const y = libre * m.alt + Math.sin(m.t * 1.6 + m.fase) * Math.min(libre * 0.08, 30);
      const yc = Math.min(Math.max(y, 0), libre);

      const giro = (yendo ? 1 : -1) * 4;
      const volteada = yendo;          // la cabeza del dibujo mira a la izquierda: se voltea al ir a la derecha

      const frame = secuencia[m.paso];
      if (m.actual !== frame) { m.pre.textContent = frame; m.actual = frame; }

      m.cont.style.transform =
        'translate3d(' + x.toFixed(1) + 'px,' + yc.toFixed(1) + 'px,0) rotate(' + giro + 'deg)';
      m.pre.style.transform = volteada
        ? 'translateX(' + bw.toFixed(1) + 'px) scale(' + (-esc) + ',' + esc + ')'
        : 'scale(' + esc + ',' + esc + ')';
    }

    function ajustarTodo() {
      medir();
      mariposas.forEach(m => { tam(m); dibujar(m); });
    }

    // --- Stop motion: todo avanza a saltos cada TICK_MS ---
    setInterval(() => {
      mariposas.forEach(m => {
        m.t += TICK_MS / 1000;
        m.paso = (m.paso + 1) % secuencia.length;
        dibujar(m);
      });
    }, TICK_MS);

    // --- Botones ---
    function agregar(color) {
      if (mariposas.length >= MAX_MARIPOSAS) return;
      crear(color, false);
    }
    document.getElementById('btn-azul').addEventListener('click', () => agregar('azul'));
    document.getElementById('btn-verde').addEventListener('click', () => agregar('verde'));

    medir();
    crear('azul', true);
    window.addEventListener('resize', ajustarTodo);
    window.addEventListener('orientationchange', () => setTimeout(ajustarTodo, 150));
  </script>
</body>
</html>
